name: Android APK

# Собирает установочный APK и выкладывает его артефактом на странице запуска
# (Actions -> Android APK -> выбрать запуск -> Artifacts).
#
# Подпись: release-сборка подписывается закоммиченным android/app/debug.keystore
# (buildTypes.release -> signingConfigs.debug), поэтому APK ставится на любое
# устройство и отпечаток подписи стабилен от сборки к сборке. assembleDebug не
# собирается: buildTypes.debug указывает на release-конфиг, у которого без
# свойства INTEGRAM_MOBILE_UPLOAD_STORE_FILE нет store-файла.
#
# Отпечаток SHA-256 из шага «Keystore fingerprint» должен совпадать с
# отпечатком в src/config/assetlinks.json — иначе диплинки не пройдут
# autoVerify (statement в ideav/crm, https://ideav.ru/.well-known/assetlinks.json).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'App.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Keystore fingerprint (сверить с assetlinks.json)
        run: keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | grep -i "SHA256"

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: integram-mobile-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
